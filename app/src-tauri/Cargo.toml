[package]
name = "woosh-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Developer storage reclaimer for Apple Silicon"

[lib]
name = "woosh_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
woosh-engine = { path = "../../engine" }
serde.workspace = true
serde_json.workspace = true
parking_lot.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSFileManager", "NSURL", "NSString", "NSArray", "NSError"] }
objc2-app-kit = { version = "0.3", features = ["NSWorkspace"] }

[dev-dependencies]
tempfile = "3"
