[workspace]
members = ["engine", "app/src-tauri"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
license = "MIT"
authors = ["Woosh"]

[workspace.dependencies]
rayon = "1.12"
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dashmap = "6.2"
crossbeam-channel = "0.5"
parking_lot = "0.12"
trash = "5.2"
anyhow = "1.0"
thiserror = "2.0"
plist = "1.10"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.bench]
opt-level = 3
lto = "thin"
debug = true
