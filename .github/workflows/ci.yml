name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  verify:
    name: Test & Lint (macOS Apple Silicon)
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
          components: clippy, rustfmt

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            app/src-tauri

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Install Frontend Dependencies
        run: |
          cd app
          pnpm install --frozen-lockfile

      - name: Frontend Typecheck & Build
        run: |
          cd app
          pnpm run build

      - name: Check Formatting
        run: cargo fmt --all -- --check

      - name: Clippy Engine
        run: cargo clippy -p woosh-engine --all-targets -- -D warnings

      - name: Run Engine Tests (Native Apple Silicon Walker)
        run: cargo test -p woosh-engine --all-targets -- --nocapture
